<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Overview of the AI company universe: aggregate indicators, broad-market indices, and market news.">
  <title>Overview | Finance Data Collector</title>
  <link rel="stylesheet" href="/src/styles/theme.css">
  <link rel="stylesheet" href="/src/styles/index.css">
  <link rel="stylesheet" href="/src/styles/overview.css">
  <script type="module" src="/src/pages/dashboard.ts"></script>
</head>
<body>
  <a class="skip-link" href="#overview-content">Skip to overview</a>

  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="Finance Data Collector home">
      <span class="wordmark-mark" aria-hidden="true">F</span>
      <span>Finance Data Collector</span>
    </a>
    <nav aria-label="Primary navigation">
      <a href="index.html" aria-current="page"><span class="nav-full">Overview</span><span class="nav-short">Overview</span></a>
      <a href="companies.html"><span class="nav-full">Companies</span><span class="nav-short">Companies</span></a>
      <a href="news.html"><span class="nav-full">News</span><span class="nav-short">News</span></a>
      <a href="layers.html"><span class="nav-full">AI layers</span><span class="nav-short">Layers</span></a>
      <a href="research.html">Research</a>
    </nav>
  </header>

  <main id="overview-content" data-overview-app>
    <h1 class="overview-title">Market overview</h1>

    <section class="overview-block" aria-labelledby="indicators-heading">
      <div class="overview-block-head">
        <h2 id="indicators-heading">Universe indicators</h2>
        <p id="overview-as-of" class="overview-as-of" role="status"></p>
      </div>
      <div id="overview-indicators" class="indicator-grid" role="status">
        <p class="data-state">Loading indicators…</p>
      </div>
    </section>

    <section class="overview-block" aria-labelledby="movers-heading">
      <div class="overview-block-head">
        <h2 id="movers-heading">Top movers</h2>
      </div>
      <div id="overview-movers" class="movers-grid" role="status">
        <p class="data-state">Loading movers…</p>
      </div>
    </section>

    <section class="overview-block" aria-labelledby="market-heading">
      <div class="overview-block-head">
        <h2 id="market-heading">Market indices</h2>
      </div>
      <div id="overview-market" role="status">
        <p class="data-state">Loading indices…</p>
      </div>
    </section>
  </main>
</body>
</html>
