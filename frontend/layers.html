<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>AI industry layers | Finance Data Collector</title>
  <link rel="stylesheet" href="/src/styles/theme.css">
  <link rel="stylesheet" href="/src/styles/layers.css">
  <script type="module" src="/src/pages/layers.ts"></script>
</head>
<body data-layers-app>
  <header id="topbar">
    <div class="brand">AI industry layers<small id="gen-time"></small></div>
    <div class="modes" aria-label="Visualization mode">
      <button class="mode active" type="button" data-mode="columns">Columns</button>
      <button class="mode" type="button" data-mode="tree">Tree</button>
      <button class="mode" type="button" data-mode="mermaid">Mermaid</button>
    </div>
    <input id="search" type="search" placeholder="Search ticker / company / description" aria-label="Search companies">
    <span id="stats"></span>
    <nav class="nav" aria-label="Primary navigation">
      <a href="index.html">AI companies</a>
      <a href="graph.html">Company graph</a>
      <a href="layers.html" aria-current="page">AI layers</a>
      <a href="research.html">Research</a>
    </nav>
  </header>

  <div id="layers-state" role="status" aria-live="polite">Reading the AI industry layers…</div>
  <svg id="view" aria-label="AI company layers visualization"></svg>
  <pre id="mermaid" hidden aria-label="Mermaid source"></pre>

  <aside id="legend" class="panel" aria-label="Layer filters">
    <h2>
      <button id="legend-toggle" type="button" aria-expanded="true" aria-controls="legend-rows">
        <span>Layers (click to filter)</span>
        <span class="chevron" aria-hidden="true"></span>
      </button>
    </h2>
    <div id="legend-rows"></div>
  </aside>

  <aside id="card" class="panel" hidden aria-live="polite">
    <button id="card-close" class="close" type="button" aria-label="Close company details">✕</button>
    <h2 id="card-name"></h2>
    <div class="sub" id="card-path"></div>
    <p id="card-desc"></p>
    <div id="card-badges"></div>
    <div class="meta" id="card-meta"></div>
  </aside>

  <div id="hint"></div>
</body>
</html>
