[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-data-collector"
version = "0.1.0"
description = "Local-first SEC identity and submissions data collector"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "beautifulsoup4>=4.12,<5",
    "edgartools==5.58.0",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "lxml>=5,<7",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0,<3",
    "typer>=0.12,<1",
    "uvicorn>=0.30,<1",
    "yfinance>=1.7,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "playwright>=1.52,<1.53",
    "requests>=2.32,<3",
    "ruff>=0.6,<1",
]

# PEP 735 dependency group: `uv sync` and `uv run` install it by default,
# while the `dev` extra above keeps `pip install .[dev]` working too.
[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "playwright>=1.52,<1.53",
    "requests>=2.32,<3",
    "ruff>=0.6,<1",
]

[project.scripts]
fdc = "fdc.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
