services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fdc
      POSTGRES_USER: fdc
      POSTGRES_PASSWORD: fdc
    ports:
      - "5432:5432"
    volumes:
      - fdc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdc -d fdc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fdc-postgres-data:
